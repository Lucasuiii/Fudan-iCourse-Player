name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build:player
      - run: git diff --exit-code -- vendor/sutro.js
      - run: node --check sutro-player.js
      - run: node --check core.js
      - run: node --check whisper-stream.js
      - run: node --check subtitle-export.js
      - run: node --check qwen-cache.js
      - run: node --check qwen-range.js
      - run: node --check options.js
      - run: python3 -m py_compile local-whisper/*.py local-qwen/*.py
      - run: python3 -m unittest discover -s local-qwen -p "test_*.py"
      - run: python3 -m unittest discover -s local-whisper -p "test_*.py"
      - run: node --check content.js
      - run: node --check background.js
      - run: node --check offscreen.js
      - run: node --check course-terms.js
      - run: node --check voice.js
      - run: node --check pcm-worklet.js
      - run: node --test tests/*.test.cjs
      - run: git diff --check
