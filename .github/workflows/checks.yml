name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check core.js
      - run: node --check whisper-prefetch.js
      - run: node --check options.js
      - run: python3 -m py_compile local-whisper/*.py
      - run: python3 -m unittest discover -s local-whisper -p "test_*.py"
      - run: node --check content.js
      - run: node --check background.js
      - run: node --check offscreen.js
      - run: node --check voice.js
      - run: node --check asr-session.js
      - run: node --check asr-worker.js
      - run: node --check pcm-worklet.js
      - run: python3 -m py_compile scripts/install-asr.py
      - run: node --test tests/*.test.cjs
      - run: git diff --check
