name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check core.js
      - run: node --check content.js
      - run: node --check background.js
      - run: node --check offscreen.js
      - run: node --check voice.js
      - run: node --test tests/*.test.cjs
      - run: git diff --check
