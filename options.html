<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Whisper 本地字幕连接</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:600px;margin:60px auto;padding:24px;color:#1d2738;background:#f3f5fa}input,textarea{display:block;width:95%;padding:12px;margin:12px 0;border:1px solid #bbc5d5;border-radius:12px}button{background:#007aff;color:white;border:0;border-radius:12px;padding:12px 18px}p{line-height:1.7}</style>
<h1>Whisper 本地字幕</h1><p>先启动本机字幕服务，再填入它生成的连接密钥。密钥仅保存在此扩展中。连接地址固定为本机 127.0.0.1:8766，录播音频由本机处理。</p>
<label>连接密钥<input id="key" type="password" autocomplete="off"></label><label>课程 ID（选填，术语仅用于此课程）<input id="course" inputmode="numeric" maxlength="10" placeholder="留空时只保存连接密钥"></label><label>课程术语提示（选填，最多 800 字）<textarea id="prompt" rows="4" maxlength="800" placeholder="不填也能识别；可按需补充专业术语"></textarea></label><button id="save">保存并检查连接</button><p id="status" role="status"></p><script src="options.js"></script></html>
