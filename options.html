<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Lyue 1.1.4 · 本地字幕服务连接</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:640px;margin:40px auto;padding:24px;color:#1d2738;background:#f3f5fa}input,textarea{display:block;box-sizing:border-box;width:100%;padding:12px;margin:12px 0;border:1px solid #bbc5d5;border-radius:12px}button{background:#007aff;color:white;border:0;border-radius:12px;padding:12px 18px}p{line-height:1.7}</style>
<h1>本地字幕服务</h1><p>先启动本机字幕服务，再填入它生成的连接密钥。密钥仅保存在此扩展中。Whisper 使用 127.0.0.1:8766，Qwen 使用 127.0.0.1:8768；音频均由本机处理。</p>
<label>连接密钥<input id="key" type="password" autocomplete="off"></label><label>课程 ID（选填，术语仅用于此课程）<input id="course" inputmode="numeric" maxlength="10" placeholder="留空时只保存连接密钥"></label><label>课程关键词（选填，最多 800 字）<textarea id="prompt" rows="4" maxlength="800" placeholder="不填也能识别；可按需补充专业术语"></textarea></label><p id="preset-info" hidden></p><label>检查服务<select id="engine"><option value="qwen" selected>Qwen 原版缓存</option><option value="whisper">Whisper 流式</option></select></label><button id="save">保存并检查连接</button><p id="status" role="status"></p><script src="course-terms.js"></script><script src="options.js"></script></html>
